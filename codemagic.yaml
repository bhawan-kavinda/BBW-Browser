workflows:
  bbw-android:
    name: BBW Browser APK
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Generate Gradle wrapper
        script: |
          mkdir -p /tmp/wrapper
          cd /tmp/wrapper
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          cp -r gradle "$CM_BUILD_DIR/"
          cp gradlew gradlew.bat "$CM_BUILD_DIR/"
      - name: Build release APK
        script: |
          cd "$CM_BUILD_DIR"
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - app/build/outputs/**/*.apk
